# Ingestion tier cadence and skill run schedule for Trading-Scanner.
# All times are in the timezone given per section unless noted otherwise.

timezone: "America/Chicago"

tiers:
  # Tier 1 — daily fundamental extraction for the stock watchlist.
  fundamentals:
    type: daily
    extraction_time: "06:30"
    watchlist_source: watchlist

  # Tier 2 — polls repeatedly through the trading day, accumulates in
  # news_sentiment rather than overwriting.
  news_sentiment:
    type: interval
    interval_minutes: 15
    start_time: "08:30"
    end_time: "15:15"

  # Tier 3 — each job runs once per day at its own time. Staggered so they
  # don't all hit Alpha Vantage in the same second. Small transactions are
  # filtered out using the thresholds below.
  daily_reference:
    type: daily
    min_insider_transaction_value: 100000
    min_congress_transaction_value: 15000
    min_institutional_holding_value: 1000000
    jobs:
      insider_transactions: "07:00"
      congress_trades: "07:05"
      institutional_holdings: "07:10"
      # Politician metadata is near-static reference data. Kept on a daily
      # schedule for now for uniformity; the cheaper long-term version is
      # "fetch once per bioguide_id, refresh only on a cache miss" —
      # revisit once the daily call volume matters.
      politician_metadata: "07:15"

  # Tier 4 — baseline technical data is fetched once daily. A separate
  # event refresh is triggered when Tier 2/3 detects a material catalyst.
  technical_core:
    type: daily_plus_catalyst_event
    baseline_time: "07:30"
    event_sources: [news_sentiment, daily_reference]
    market_hours_only: true
    includes: [ohlcv, indicators, index, options]

# When the two existing skills run against whatever is currently in the store.
skills:
  swing_trade_scanner:
    # placeholder cadence — adjust to your actual routine
    cron: "0 8,12,15 * * 1-5"
  catalyst_confluence_scanner:
    # matches the existing 9:45 AM / 2:45 PM CT run times
    cron: "45 9,14 * * 1-5"
